<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kwa Zwai Admin | RSVP Dashboard</title>
  <style>
    :root {
      --bg: #090a0d;
      --panel: #15171c;
      --panel-light: #1d2027;
      --border: #2b2f38;
      --red: #e61c24;
      --red-hover: #ff343c;
      --text: #f7f7f8;
      --muted: #9ca1ad;
      --success: #5dd39e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, rgba(230, 28, 36, 0.18), transparent 38%), var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      padding: 28px 18px;
    }

    .shell { width: min(1100px, 100%); margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .eyebrow {
      color: var(--red-hover);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 { margin: 7px 0 0; font-size: clamp(1.6rem, 4vw, 2.4rem); }
    .muted { color: var(--muted); }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      color: #fff;
      background: var(--red);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { background: var(--red-hover); }
    button.secondary { background: var(--panel-light); border: 1px solid var(--border); }
    button.secondary:hover { border-color: var(--red); }

    .auth-card, .dashboard { background: rgba(21, 23, 28, 0.94); border: 1px solid var(--border); border-radius: 14px; }
    .auth-card { width: min(430px, 100%); margin: 8vh auto 0; padding: 28px; }
    .auth-card h2 { margin: 0 0 8px; }
    .auth-card p { margin: 0 0 22px; line-height: 1.5; }

    label { display: block; color: var(--muted); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; margin: 15px 0 7px; text-transform: uppercase; }
    input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 13px; background: #0d0f13; color: #fff; font: inherit; }
    input:focus { outline: 2px solid rgba(230, 28, 36, 0.45); border-color: var(--red); }
    .auth-card button { width: 100%; margin-top: 20px; }
    .status { min-height: 20px; margin-top: 14px; color: var(--red-hover); font-size: 0.8rem; }

    .dashboard { padding: 20px; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat { background: var(--panel-light); border: 1px solid var(--border); border-radius: 10px; padding: 17px; }
    .stat span { display: block; color: var(--muted); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .stat strong { display: block; margin-top: 7px; font-size: 1.8rem; }

    .toolbar { display: flex; gap: 10px; justify-content: space-between; margin-bottom: 14px; }
    .toolbar input { max-width: 420px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { padding: 13px 14px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    th { color: var(--muted); background: var(--panel-light); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; }
    td { font-size: 0.82rem; }
    tr:last-child td { border-bottom: 0; }
    .empty { padding: 30px; text-align: center; color: var(--muted); }
    .hidden { display: none !important; }

    @media (max-width: 620px) {
      body { padding: 18px 12px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .stats { grid-template-columns: 1fr; }
      .dashboard { padding: 12px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .toolbar input { max-width: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Kwa Zwai Entertainment</div>
        <h1>RSVP Dashboard</h1>
        <div class="muted">Sdumane's House guest list</div>
      </div>
      <button class="secondary hidden" id="logoutBtn" type="button">Log out</button>
    </header>

    <section class="auth-card" id="authCard">
      <h2>Admin sign in</h2>
      <p class="muted">Sign in with the Firebase admin account to view private RSVP details.</p>
      <form id="loginForm">
        <label for="adminEmail">Admin email</label>
        <input id="adminEmail" type="email" value="matlhagaamogelangrefilwe@gmail.com" autocomplete="username" readonly />
        <label for="adminPassword">Password</label>
        <input id="adminPassword" type="password" autocomplete="current-password" required />
        <button type="submit">Sign in</button>
      </form>
      <div class="status" id="authStatus" role="status"></div>
    </section>

    <main class="dashboard hidden" id="dashboard">
      <div class="stats">
        <div class="stat"><span>Total RSVPs</span><strong id="totalCount">0</strong></div>
        <div class="stat"><span>Showing</span><strong id="visibleCount">0</strong></div>
        <div class="stat"><span>Last updated</span><strong id="updatedAt">--:--</strong></div>
      </div>
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search name, email, or phone" />
        <div>
          <button class="secondary" id="refreshBtn" type="button">Refresh</button>
          <button id="exportBtn" type="button">Export CSV</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Preferred name</th><th>Email</th><th>Phone</th><th>RSVP date</th></tr></thead>
          <tbody id="rsvpRows"></tbody>
        </table>
        <div class="empty hidden" id="emptyState">No RSVPs match your search.</div>
      </div>
      <div class="status" id="dashboardStatus" role="status"></div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { collection, getFirestore, getDocs, orderBy, query } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyBn3Fgzpl2SWrSCEIuu7dP4478vt75T6lE',
      authDomain: 'syreevent.firebaseapp.com',
      projectId: 'syreevent',
      storageBucket: 'syreevent.firebasestorage.app',
      messagingSenderId: '382314791966',
      appId: '1:382314791966:web:5acb87ea7507d4e1c39a0f'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const rsvpCollection = collection(db, 'rsvps');
    const ADMIN_EMAIL = 'matlhagaamogelangrefilwe@gmail.com';
    const authCard = document.getElementById('authCard');
    const dashboard = document.getElementById('dashboard');
    const logoutBtn = document.getElementById('logoutBtn');
    const authStatus = document.getElementById('authStatus');
    const dashboardStatus = document.getElementById('dashboardStatus');
    const rows = document.getElementById('rsvpRows');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    let rsvps = [];

    function renderRows() {
      const search = searchInput.value.trim().toLowerCase();
      const visible = rsvps.filter((rsvp) => [rsvp.name, rsvp.preferredName, rsvp.email, rsvp.phone].join(' ').toLowerCase().includes(search));
      rows.innerHTML = visible.map((rsvp) => `<tr><td>${escapeHtml(rsvp.name)}</td><td>${escapeHtml(rsvp.preferredName)}</td><td>${escapeHtml(rsvp.email)}</td><td>${escapeHtml(rsvp.phone)}</td><td>${escapeHtml(rsvp.date)}</td></tr>`).join('');
      emptyState.classList.toggle('hidden', visible.length !== 0);
      document.getElementById('visibleCount').textContent = visible.length;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[character]));
    }

    async function loadRsvps() {
      dashboardStatus.textContent = 'Loading RSVPs...';
      const snapshot = await getDocs(query(rsvpCollection, orderBy('createdAt', 'desc')));
      rsvps = snapshot.docs.map((record) => {
        const data = record.data();
        const createdAt = data.createdAt?.toDate?.() || new Date(data.timestamp);
        return { ...data, date: createdAt.toLocaleString() };
      });
      document.getElementById('totalCount').textContent = rsvps.length;
      document.getElementById('updatedAt').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      dashboardStatus.textContent = '';
      renderRows();
    }

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      authStatus.textContent = 'Signing in...';
      try {
        await signInWithEmailAndPassword(auth, ADMIN_EMAIL, document.getElementById('adminPassword').value);
      } catch (error) {
        authStatus.textContent = 'Sign-in failed. Check the admin account and try again.';
        console.error(error);
      }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));
    document.getElementById('refreshBtn').addEventListener('click', loadRsvps);
    searchInput.addEventListener('input', renderRows);
    document.getElementById('exportBtn').addEventListener('click', () => {
      const header = ['Name', 'Preferred name', 'Email', 'Phone', 'RSVP date'];
      const csv = [header, ...rsvps.map((rsvp) => [rsvp.name, rsvp.preferredName, rsvp.email, rsvp.phone, rsvp.date])]
        .map((line) => line.map((value) => `"${String(value ?? '').replace(/"/g, '""')}"`).join(','))
        .join('\n');
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      link.download = 'kwazwai-rsvps.csv';
      link.click();
      URL.revokeObjectURL(link.href);
    });

    onAuthStateChanged(auth, async (user) => {
      const isAdmin = user?.email?.toLowerCase() === ADMIN_EMAIL;
      authCard.classList.toggle('hidden', Boolean(isAdmin));
      dashboard.classList.toggle('hidden', !isAdmin);
      logoutBtn.classList.toggle('hidden', !isAdmin);
      if (isAdmin) {
        authStatus.textContent = '';
        try { await loadRsvps(); } catch (error) { dashboardStatus.textContent = 'Could not load RSVPs. Check the Firestore rules.'; console.error(error); }
      }
    });
  </script>
</body>
</html>
